# The quality gate, defined once and called by both build.yml (pushes and
# pull requests) and release.yml (tags). Keeping it in one place is the
# point: a release must clear exactly the same bar as a pull request, and
# two copies of these steps would eventually disagree.
#
# Three jobs, the same three in all three EVPanda SDKs:
#   lint     — once, since it does not vary by interpreter version
#   test     — across every supported interpreter
#   package  — prove what ships actually works, from outside this repo
#
# Plus one this SDK alone needs: `bare`, which proves the optional extras
# really are optional.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject's requires-python, plus every release
        # since. The SDK has one runtime dependency, so this is very nearly
        # the whole compatibility surface.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

  bare:
    name: Test without the adapter extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The adapter extras are optional, so prove the SDK works without
      # them: an import of evpanda must not need httpx or requests, and
      # everything but their two suites must pass on a plain install.
      - name: Install the package and the test runner only
        run: pip install -e . pytest

      - name: Import cleanly
        run: python -c "import evpanda, evpanda.ocpi; print(evpanda.__version__)"

      # The suites that need an extra skip themselves; everything else must
      # pass exactly as it does with the extras installed.
      - name: Pytest
        run: pytest

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine check
        run: twine check --strict dist/*

      # The package sits at the repo root, so a test run imports the working
      # tree whether or not the wheel is complete. Installing the built
      # wheel and importing it from somewhere else is what proves a module,
      # or py.typed, did not fall out of the build.
      - name: Import the built wheel, away from the source tree
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -c "
          import importlib.resources as res
          import evpanda, evpanda.ocpi
          from evpanda.ocpi import asgi, wsgi
          assert res.files('evpanda').joinpath('py.typed').is_file(), 'py.typed missing'
          print('wheel imports cleanly:', evpanda.__version__)
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
