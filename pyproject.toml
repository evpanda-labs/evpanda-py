[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evpanda"
dynamic = ["version"]
description = "Passive OCPI / OCPP traffic capture for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EVPanda" }]
keywords = [
  "ocpi",
  "ocpp",
  "ev-charging",
  "cpo",
  "emsp",
  "observability",
  "telemetry",
  "sdk",
  "evpanda",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
# One runtime dependency: zstandard, the codec every EVPanda SDK ships
# batches with. The extras below are only for the two outbound adapters.
dependencies = ["zstandard>=0.22"]

[project.urls]
Homepage = "https://github.com/evpanda-labs/evpanda-py"
Repository = "https://github.com/evpanda-labs/evpanda-py"
Issues = "https://github.com/evpanda-labs/evpanda-py/issues"

[project.optional-dependencies]
# Only for evpanda.ocpi.HTTPXTransport / RequestsAdapter.
httpx = ["httpx>=0.27"]
requests = ["requests>=2.31"]
dev = [
  "ruff>=0.9",
  "mypy>=1.13",
  "pytest>=8",
  "httpx>=0.27",
  "requests>=2.31",
  "types-requests",
  # Only for tests/test_ocpi_frameworks.py — the adapters themselves stay
  # framework-agnostic.
  "flask>=3",
  "starlette>=0.37",
]

[tool.hatch.version]
path = "evpanda/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["evpanda"]

[tool.hatch.build.targets.sdist]
include = ["evpanda", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tests"]

[tool.ruff.format]
# Ruff formats fenced Python in Markdown too. The README's examples are
# aligned for reading, not for the formatter, so it stays out of them.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into the internals they are testing.
"tests/*" = ["SLF001"]

[tool.mypy]
strict = true
python_version = "3.12"
# Strict on the shipped package; the tests are annotated but not gated on
# strict-mode pedantry about their own fixtures.
files = ["evpanda"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
